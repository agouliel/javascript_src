<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacts</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --line:#dde2ea; --pri:#2563eb; --ok:#16a34a; --bad:#dc2626; --txt:#1f2937; --mut:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--txt); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  h1 { font-size:18px; margin:0 12px 0 0; }
  main { max-width:1100px; margin:16px auto; padding:0 16px; }
  button, select, input, textarea { font:inherit; }
  button { border:1px solid var(--line); background:#fff; padding:7px 12px; border-radius:6px; cursor:pointer; }
  button:hover:not(:disabled) { background:#eef2f7; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.pri { background:var(--pri); color:#fff; border-color:var(--pri); }
  button.pri:hover:not(:disabled) { background:#1d4ed8; }
  button.ok { color:var(--ok); border-color:var(--ok); }
  button.bad { color:var(--bad); border-color:var(--bad); }
  input[type=text], input[type=search], input[type=email], select, textarea { border:1px solid var(--line); border-radius:6px; padding:7px 9px; background:#fff; width:100%; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .bar input[type=search] { width:240px; }
  .bar select { width:auto; }
  .spacer { flex:1; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th, td { padding:9px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { background:#f9fafb; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); cursor:pointer; user-select:none; white-space:nowrap; }
  th.nosort { cursor:default; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#f3f7ff; }
  td.chk, th.chk { width:34px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); background:#f3f4f6; }
  .badge.v { background:#dcfce7; border-color:#86efac; color:#166534; }
  .badge.u { background:#fef3c7; border-color:#fcd34d; color:#92400e; }
  .sub { color:var(--mut); font-size:12px; }
  .empty { text-align:center; color:var(--mut); padding:40px; }
  .count { color:var(--mut); margin-left:4px; }
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #overlay.show { display:flex; }
  .modal { background:#fff; border-radius:10px; width:560px; max-width:100%; max-height:95vh; overflow:auto; padding:20px; }
  .modal h2 { margin:0 0 14px; font-size:17px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .grid .full { grid-column:1/-1; }
  label { display:block; font-size:12px; color:var(--mut); margin-bottom:3px; }
  #scanBox img, #scanBox iframe { width:100%; border:1px solid var(--line); border-radius:6px; background:#fafafa; }
  #scanBox iframe { height:360px; }
  .actions { display:flex; gap:8px; margin-top:16px; }
  #progress { position:fixed; bottom:16px; right:16px; background:#111827; color:#fff; padding:10px 14px; border-radius:8px; max-width:340px; display:none; z-index:20; }
  #progress.show { display:block; }
  #progress .bar2 { height:4px; background:#374151; border-radius:2px; margin-top:6px; overflow:hidden; }
  #progress .bar2 i { display:block; height:100%; width:0; background:#60a5fa; }
</style>
</head>
<body>
<header>
  <h1>📇 Contacts</h1>
  <button class="pri" id="addBtn">+ ADD CONTACT</button>
  <button id="scanBtn">Process scanned cards…</button>
  <input type="file" id="files" accept="image/*,application/pdf,.pdf" multiple hidden>
  <span class="spacer"></span>
  <button class="ok" id="verifyBtn" disabled>Verify</button>
  <button class="bad" id="deleteBtn" disabled>Delete</button>
</header>

<main>
  <div class="bar">
    <input type="search" id="search" placeholder="Search name, company, email, notes…">
    <select id="fCat"></select>
    <select id="fVer">
      <option value="">All verification</option>
      <option value="verified">Verified</option>
      <option value="unverified">Unverified</option>
    </select>
    <span class="spacer"></span>
    <span class="sub" id="selInfo"></span>
  </div>
  <table>
    <thead><tr>
      <th class="chk nosort"><input type="checkbox" id="all"></th>
      <th data-k="name">Name</th>
      <th data-k="company">Company</th>
      <th data-k="title">Title</th>
      <th data-k="email">Email</th>
      <th data-k="phone">Phone</th>
      <th data-k="category">Category</th>
      <th data-k="verified">Status</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<div id="overlay"><form class="modal" id="form" autocomplete="off">
  <h2 id="mTitle">Contact</h2>
  <div class="grid">
    <div><label>Name</label><input type="text" id="f_name"></div>
    <div><label>Job title</label><input type="text" id="f_title"></div>
    <div><label>Company</label><input type="text" id="f_company"></div>
    <div><label>Email</label><input type="email" id="f_email"></div>
    <div><label>Phone</label><input type="text" id="f_phone"></div>
    <div><label>Website</label><input type="text" id="f_website"></div>
    <div class="full"><label>Address</label><input type="text" id="f_address"></div>
    <div><label>Category</label><select id="f_category"></select></div>
    <div><label>Verification</label><select id="f_verified"><option value="0">Unverified</option><option value="1">Verified</option></select></div>
    <div class="full"><label>Notes</label><textarea id="f_notes" rows="5"></textarea></div>
    <div class="full" id="scanBox" hidden>
      <label>Scanned file: <span id="scanName"></span> · <a id="scanLink" target="_blank">open / download</a></label>
      <div id="scanView"></div>
    </div>
  </div>
  <div class="actions">
    <button type="submit" class="pri">Save changes</button>
    <button type="button" id="cancelBtn">Cancel</button>
    <span class="spacer"></span>
    <button type="button" class="bad" id="delOne">Delete</button>
  </div>
</form></div>

<div id="progress"><div id="progText"></div><div class="bar2"><i id="progBar"></i></div></div>

<script>
const CATEGORIES = ['Vetting Inspector','Class','Banking','Finance','Oil Major','Other'];
const KEY = 'contacts.v1';
const PDFJS_BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
const TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
const $ = id => document.getElementById(id);

let contacts = JSON.parse(localStorage.getItem(KEY) || '[]');
let selected = new Set();
let sort = { k:'name', dir:1 };
let editingId = null;

const save = () => localStorage.setItem(KEY, JSON.stringify(contacts));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function newContact(o = {}) {
  return { id: uid(), name:'', title:'', company:'', email:'', phone:'', website:'', address:'',
           category:'Other', verified:false, notes:'', created:Date.now(), ...o };
}

// ---------- init selects ----------
$('fCat').innerHTML = '<option value="">All categories</option>' + CATEGORIES.map(c => `<option>${c}</option>`).join('');
$('f_category').innerHTML = CATEGORIES.map(c => `<option>${c}</option>`).join('');

// ---------- scanned-file storage (IndexedDB, kept apart from contact data) ----------
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('contacts-scans', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('files');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function fileStore(mode, fn) {
  const db = await dbp;
  return new Promise((res, rej) => {
    const tx = db.transaction('files', mode);
    const req = fn(tx.objectStore('files'));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = tx.onabort = () => rej(tx.error);
  });
}
const putScan = async (id, file) => fileStore('readwrite', st => st.put({ name: file.name, type: file.type || 'application/octet-stream', data: file.__buf }, id));
const getScan = id => fileStore('readonly', st => st.get(id)).catch(() => null);
const delScans = ids => fileStore('readwrite', st => ids.forEach(i => st.delete(i))).catch(() => {});

// ---------- rendering ----------
function visible() {
  const q = $('search').value.trim().toLowerCase();
  const cat = $('fCat').value, ver = $('fVer').value;
  let list = contacts.filter(c =>
    (!cat || c.category === cat) &&
    (!ver || (ver === 'verified') === c.verified) &&
    (!q || [c.name,c.title,c.company,c.email,c.phone,c.website,c.address,c.notes,c.category].join(' ').toLowerCase().includes(q)));
  const k = sort.k;
  list.sort((a, b) => {
    const x = k === 'verified' ? +a.verified : (a[k] || '').toString().toLowerCase();
    const y = k === 'verified' ? +b.verified : (b[k] || '').toString().toLowerCase();
    if (x === y) return 0;
    if (k !== 'verified' && (x === '' || y === '')) return x === '' ? 1 : -1; // blanks last
    return (x > y ? 1 : -1) * sort.dir;
  });
  return list;
}

function render() {
  const list = visible();
  const ids = new Set(contacts.map(c => c.id));
  selected = new Set([...selected].filter(i => ids.has(i)));
  $('rows').innerHTML = list.length ? list.map(c => `
    <tr data-id="${c.id}">
      <td class="chk"><input type="checkbox" ${selected.has(c.id) ? 'checked' : ''}></td>
      <td><b>${esc(c.name) || '<span class="sub">(no name)</span>'}</b></td>
      <td>${esc(c.company)}</td>
      <td>${esc(c.title)}</td>
      <td>${esc(c.email)}</td>
      <td>${esc(c.phone)}</td>
      <td><span class="badge">${esc(c.category)}</span></td>
      <td><span class="badge ${c.verified ? 'v' : 'u'}">${c.verified ? 'Verified' : 'Unverified'}</span></td>
    </tr>`).join('')
    : `<tr><td colspan="8" class="empty">${contacts.length ? 'No contacts match the current filters.' : 'No contacts yet. Add one or scan business cards.'}</td></tr>`;
  document.querySelectorAll('th[data-k]').forEach(th => {
    th.textContent = th.textContent.replace(/ [▲▼]$/, '');
    if (th.dataset.k === sort.k) th.textContent += sort.dir > 0 ? ' ▲' : ' ▼';
  });
  const n = selected.size;
  $('verifyBtn').disabled = $('deleteBtn').disabled = !n;
  $('selInfo').textContent = `${list.length} of ${contacts.length} shown` + (n ? ` · ${n} selected` : '');
  $('all').checked = list.length > 0 && list.every(c => selected.has(c.id));
}

// ---------- events ----------
['search','fCat','fVer'].forEach(id => $(id).addEventListener('input', render));
document.querySelector('thead').addEventListener('click', e => {
  const th = e.target.closest('th[data-k]'); if (!th) return;
  sort = { k: th.dataset.k, dir: sort.k === th.dataset.k ? -sort.dir : 1 };
  render();
});
$('all').addEventListener('change', e => {
  visible().forEach(c => e.target.checked ? selected.add(c.id) : selected.delete(c.id));
  render();
});
$('rows').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-id]'); if (!tr) return;
  const id = tr.dataset.id;
  if (e.target.type === 'checkbox') {
    e.target.checked ? selected.add(id) : selected.delete(id);
    render();
  } else if (!e.target.closest('td.chk')) openDetails(id);
});
$('verifyBtn').onclick = () => {
  contacts.forEach(c => { if (selected.has(c.id)) c.verified = true; });
  save(); selected.clear(); render();
};
$('deleteBtn').onclick = () => {
  if (!confirm(`Delete ${selected.size} contact(s)?`)) return;
  delScans([...selected]);
  contacts = contacts.filter(c => !selected.has(c.id));
  save(); selected.clear(); render();
};

// ---------- details modal ----------
const FIELDS = ['name','title','company','email','phone','website','address','category','notes'];
function openDetails(id) {
  editingId = id;
  const c = id ? contacts.find(x => x.id === id) : newContact();
  $('mTitle').textContent = id ? 'Contact details' : 'New contact';
  FIELDS.forEach(f => $('f_' + f).value = c[f] || '');
  $('f_verified').value = c.verified ? '1' : '0';
  $('delOne').style.display = id ? '' : 'none';
  $('overlay').classList.add('show');
  $('f_name').focus();
  showScan(id);
}
let scanUrl = null;
async function showScan(id) {
  if (scanUrl) { URL.revokeObjectURL(scanUrl); scanUrl = null; }
  $('scanBox').hidden = true; $('scanView').innerHTML = '';
  const rec = id && await getScan(id);
  if (!rec || editingId !== id) return;
  scanUrl = URL.createObjectURL(new Blob([rec.data], { type: rec.type }));
  $('scanName').textContent = rec.name;
  $('scanLink').href = scanUrl; $('scanLink').download = rec.name;
  const el = document.createElement(rec.type === 'application/pdf' ? 'iframe' : 'img');
  el.src = scanUrl;
  $('scanView').appendChild(el);
  $('scanBox').hidden = false;
}
const closeModal = () => { $('overlay').classList.remove('show'); editingId = null; showScan(null); };
$('addBtn').onclick = () => openDetails(null);
$('cancelBtn').onclick = closeModal;
$('overlay').addEventListener('mousedown', e => { if (e.target === $('overlay')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const data = {};
  FIELDS.forEach(f => data[f] = $('f_' + f).value.trim());
  data.notes = $('f_notes').value; // keep notes formatting
  data.verified = $('f_verified').value === '1';
  if (editingId) Object.assign(contacts.find(c => c.id === editingId), data);
  else contacts.push(newContact(data));
  save(); closeModal(); render();
});
$('delOne').onclick = () => {
  if (!confirm('Delete this contact?')) return;
  delScans([editingId]);
  contacts = contacts.filter(c => c.id !== editingId);
  save(); closeModal(); render();
};

// ---------- OCR ----------
let tessPromise = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  return tessPromise ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = TESSERACT_URL;
    s.onload = res;
    s.onerror = () => { tessPromise = null; rej(new Error('Could not load the OCR engine (Tesseract.js). Check your internet connection for the first run.')); };
    document.head.appendChild(s);
  });
}

let pdfPromise = null;
function loadPdfJs() {
  if (window.pdfjsLib && pdfjsLib.GlobalWorkerOptions.workerSrc) return Promise.resolve();
  return pdfPromise ||= (async () => {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = PDFJS_BASE + 'pdf.min.js';
      s.onload = res;
      s.onerror = () => rej(new Error('Could not load the PDF reader. Check your internet connection for the first run.'));
      document.head.appendChild(s);
    });
    // Blob worker avoids cross-origin worker restrictions when running from file://
    const code = await (await fetch(PDFJS_BASE + 'pdf.worker.min.js')).text();
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
  })().catch(e => { pdfPromise = null; throw e; });
}

async function pdfPages(file) {
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const vp = page.getViewport({ scale: 2.5 });
    const cv = document.createElement('canvas');
    cv.width = vp.width; cv.height = vp.height;
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    pages.push(cv);
  }
  return pages;
}

// Higher OCR confidence and more recognised fields = more correct page
function scoreResult(data, parsed) {
  const found = ['name','title','company','email','phone'].filter(k => parsed[k]).length;
  return data.confidence + 15 * found;
}

function progress(text, frac) {
  $('progress').classList.toggle('show', text !== null);
  if (text !== null) { $('progText').textContent = text; $('progBar').style.width = Math.round((frac || 0) * 100) + '%'; }
}

$('scanBtn').onclick = () => $('files').click();
$('files').addEventListener('change', async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  let added = 0, failed = [];
  try {
    progress('Loading OCR engine…', 0);
    await loadTesseract();
    const worker = await Tesseract.createWorker('eng', 1, {
      logger: m => {
        if (m.status === 'recognizing text') progress(`${label}: reading text…`, (done + m.progress) / files.length);
        else progress(`${label}: ${m.status}…`, done / files.length);
      }
    });
    var done = 0, label = '';
    const isPdf = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    for (const f of files) {
      label = `${done + 1}/${files.length} ${f.name}`;
      try {
        const inputs = isPdf(f) ? await pdfPages(f) : [f];
        let best = null;
        for (const [i, inp] of inputs.entries()) {
          if (inputs.length > 1) label = `${done + 1}/${files.length} ${f.name} (page ${i + 1}/${inputs.length})`;
          const { data } = await worker.recognize(inp);
          if (!data.text.trim()) continue;
          const parsed = parseCard(data.text);
          const score = scoreResult(data, parsed);
          if (!best || score > best.score) best = { parsed, score };
        }
        if (!best) throw new Error('no text');
        const nc = newContact(best.parsed);
        f.__buf = await f.arrayBuffer();
        await putScan(nc.id, f);
        contacts.push(nc);
        added++; save(); render();
      } catch (err) { console.error(err); failed.push(f.name); }
      done++;
    }
    await worker.terminate();
  } catch (err) {
    alert(err.message);
  }
  progress(null);
  if (failed.length) alert('Could not process: ' + failed.join(', '));
  if (added) { sort = { k: 'created', dir: -1 }; render(); }
});

// ---------- lightweight card-text understanding (rule-based, on-device) ----------
const TITLE_RE = /\b(manager|director|inspector|surveyor|officer|president|vice|vp|ceo|cfo|coo|cto|head|chief|engineer|superintendent|executive|partner|associate|analyst|consultant|advisor|adviser|supervisor|coordinator|specialist|broker|trader|banker|lead|founder|owner|principal|representative|auditor|captain|master)\b/i;
const COMPANY_RE = /\b(ltd|limited|inc|llc|llp|plc|gmbh|ag|sa|s\.a\.|bv|nv|corp|corporation|co\.|company|group|holdings|bank|shipping|marine|maritime|petroleum|oil|energy|register|lloyd'?s|bureau|veritas|classification|class|finance|capital|partners|services|international|shell|bp|exxon|chevron|total)\b/i;
const ADDRESS_RE = /\b(street|st\.|road|rd\.|avenue|ave\.?|blvd|boulevard|floor|suite|P\.?O\.? ?box|square|lane|drive|tower|building|plaza|quay|harbou?r)\b|\b\d{4,5}\b/i;

function parseCard(text) {
  const out = {};
  const lines = text.split(/\r?\n/).map(l => l.replace(/[|_•·]+/g, ' ').replace(/\s+/g, ' ').trim()).filter(l => l.length > 1);
  const used = new Set();

  const email = text.match(/[A-Za-z0-9._%+-]+\s?@\s?[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);
  if (email) out.email = email[0].replace(/\s/g, '').toLowerCase();

  const site = text.match(/\b(?:https?:\/\/)?(?:www\.)[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?:\/\S*)?/i)
            || (out.email ? null : text.match(/\b[A-Za-z0-9-]+\.(?:com|net|org|gr|eu|co\.uk|io|biz)\b/i));
  if (site) out.website = site[0].replace(/[.,;]+$/, '');

  const phones = [];
  const PH = /(?:\+|00)?\(?\d[\d\s().\-\/]{5,}\d/g;
  lines.forEach((l, i) => {
    if (/@/.test(l)) { used.add(i); return; }
    if (/\bwww\.|https?:/i.test(l)) { used.add(i); return; }
    // OCR often reads 0 as O/o inside numbers after a label
    const norm = l.replace(/(?<=[\d+(\s-])[Oo](?=[\d\s)-])/g, '0');
    const fax = /\b(fax|f)\s*[:.]/i.test(norm);
    const mob = /\b(mob(ile)?|cell|m)\s*[:.]/i.test(norm);
    const lab = /\b(tel(ephone)?|phone|ph|t|direct|office|dir)\s*[:.]/i.test(norm) || mob;
    for (const m of norm.match(PH) || []) {
      const digits = m.replace(/\D/g, '');
      if (digits.length < 7 || digits.length > 15) continue;
      if (/^(19|20)\d{2}[\s.\-\/]\d{1,2}[\s.\-\/]\d{1,2}$/.test(m.trim())) continue;
      phones.push({ n: m.trim().replace(/^[(.\-\/\s]+|[.\-\/\s]+$/g, ''), pri: fax ? 9 : mob ? 0 : lab ? 1 : 2, plus: /^(\+|00)/.test(m.trim()) ? 0 : 1 });
      if (norm.replace(m, '').replace(/[^A-Za-z]/g, '').length < 10) used.add(i);
    }
  });
  const pick = phones.sort((a, b) => a.pri - b.pri || a.plus - b.plus)[0];
  if (pick) out.phone = pick.n;

  const clean = (l, i) => !used.has(i) && !/\d{7,}/.test(l.replace(/\D/g, '') ? l : '') ;
  const cand = lines.map((l, i) => ({ l, i })).filter(({ l, i }) => !used.has(i));

  const t = cand.find(({ l }) => TITLE_RE.test(l) && l.length < 60);
  if (t) { out.title = t.l; used.add(t.i); }

  const c = cand.find(({ l, i }) => !used.has(i) && COMPANY_RE.test(l) && !/\d{5,}/.test(l));
  if (c) { out.company = c.l; used.add(c.i); }

  const nameOk = l => /^[\p{L}][\p{L}.'’-]*(\s+[\p{L}][\p{L}.'’-]*){1,3}$/u.test(l) && !/\d/.test(l);
  const n = cand.find(({ l, i }) => !used.has(i) && nameOk(l) && !COMPANY_RE.test(l) && !ADDRESS_RE.test(l));
  if (n) {
    out.name = n.l.replace(/\b(\p{Lu})(\p{Lu}+)\b/gu, (_, a, b) => a + b.toLowerCase());
    used.add(n.i);
  } else if (out.email) {
    out.name = out.email.split('@')[0].split(/[._-]/).map(s => s[0]?.toUpperCase() + s.slice(1)).join(' ');
  }

  if (!out.company) {
    const dom = (out.email || out.website || '').replace(/^.*@/, '').replace(/^(https?:\/\/)?(www\.)?/, '').split('.')[0];
    if (dom && !/^(gmail|yahoo|hotmail|outlook|icloud|gr)$/i.test(dom)) out.company = dom[0].toUpperCase() + dom.slice(1);
  }

  const addr = cand.filter(({ l, i }) => !used.has(i) && ADDRESS_RE.test(l));
  if (addr.length) out.address = addr.map(a => a.l).join(', ');

  out.notes = 'Scanned from business card.\n--- OCR text ---\n' + lines.join('\n');
  out.category = 'Other';
  out.verified = false;
  return out;
}

render();
</script>
